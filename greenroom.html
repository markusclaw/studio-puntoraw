<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>.RAW Sessions — Greenroom</title>
<style>
/* ============================================================
   .RAW SESSIONS — Guest Greenroom (with pre-show preflight)
   Stage 1: the guest checks camera, mic level, framing + name.
   Stage 2: they publish into the room and wait to be admitted.
   State is driven by the same Cloudflare Worker as the console.
   ============================================================ */
:root{
  --bg:#0c0b0a; --panel:#141312; --panel-2:#1a1917; --hair:rgba(255,255,255,.06);
  --text:#ECE7DD; --muted:#8f877b; --soft:#5f5a52;
  --accent:#C6763B; --ember:#D2542A; --rec:#E0483B; --ok:#6f9c5a;
  --mono:"SFMono-Regular",Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--mono);
  background-image:
    radial-gradient(ellipse 70% 50% at 30% 40%, rgba(198,118,59,.05) 0%, transparent 100%),
    radial-gradient(ellipse 60% 50% at 75% 70%, rgba(214,65,43,.04) 0%, transparent 100%);
  display:grid;place-items:center;min-height:100dvh;-webkit-font-smoothing:antialiased;padding:20px;
}
.wrap{width:min(760px,calc(100vw - 32px));display:grid;gap:16px}

.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px rgba(224,72,59,.5)}
.brand .wm{font-size:16px;letter-spacing:.02em}
.brand .wm .a{color:var(--accent)}
.brand .sub{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.who b{color:var(--text)}

.cam{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;
  border:1px solid var(--hair);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.cam iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
.cam .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:12px;letter-spacing:.06em;text-align:center;padding:24px}

/* preflight */
.pf{display:grid;gap:13px}
.metawrap{display:grid;gap:6px}
.metawrap .lab{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.meter{height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--accent));transition:width 80ms linear}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.field select,.field input{width:100%;background:var(--panel-2);border:0;border-radius:7px;color:var(--text);font-family:var(--mono);font-size:14px;padding:10px 11px}
.field select:focus,.field input:focus{outline:1px solid var(--accent)}
.enter{background:var(--accent);border:0;border-radius:8px;color:#1a120b;font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:13px;cursor:pointer}
.enter:hover{background:#d5843f}
.hint{font-size:11px;color:var(--muted);text-align:center;line-height:1.5}

.status{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--hair)}
.status .pip{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--soft)}
.status .pip.wait{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.status .pip.live{background:var(--ok)}
.status .pip.off{background:var(--soft)}
@keyframes pulse{50%{opacity:.35}}
.status .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.status .t{font-size:14px;color:var(--text)}
.status .s{font-size:11px;color:var(--muted);letter-spacing:.02em}
.status[data-state="admitted"]{border-color:rgba(111,156,90,.35);background:rgba(111,156,90,.06)}
.status[data-state="offline"]{opacity:.7}

.foot{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand"><span class="dot"></span><div><div class="wm"><span class="a">.RAW</span> SESSIONS</div><div class="sub">Greenroom</div></div></div>
    <div class="who" id="who"></div>
  </div>

  <div class="cam" id="cam">
    <video id="preview" autoplay muted playsinline class="hidden"></video>
    <div class="placeholder" id="camPh">Starting camera…</div>
  </div>

  <!-- Stage 1: preflight -->
  <div class="pf" id="preflight">
    <div class="metawrap">
      <div class="lab"><span>Mic level</span><span id="micHint">say something…</span></div>
      <div class="meter"><span id="micBar"></span></div>
    </div>
    <div class="row">
      <div class="field"><label>Camera</label><select id="camSel"><option value="">Default</option></select></div>
      <div class="field"><label>Microphone</label><select id="micSel"><option value="">Default</option></select></div>
    </div>
    <div class="field"><label>Your name</label><input id="nameInput" type="text" maxlength="60" placeholder="e.g. Johnny" autocomplete="off" /></div>
    <button class="enter" id="enterBtn" type="button">Enter greenroom &rarr;</button>
    <div class="hint" id="pfHint">Check your camera and mic look right, then enter. The host brings you on air when the show's ready — you'll wait here until then.</div>
  </div>

  <!-- Stage 2: waiting to be admitted -->
  <div id="stage" class="hidden">
    <div class="status" id="status" data-state="connecting">
      <span class="pip" id="pip"></span>
      <div class="txt"><div class="t" id="statusT">Connecting&hellip;</div><div class="s" id="statusS">Reaching the studio</div></div>
    </div>
  </div>

  <div class="foot">.RAW Sessions &middot; you'll go live when the host brings you on</div>
</div>

<script src="room-client.js"></script>
<script>
"use strict";
const WORKER_URL = "wss://raw-studio-host.rovelo-ga.workers.dev";
const VDO_BASE = "https://vdo.ninja";
const params = new URLSearchParams(location.search);
const ROOM = params.get("room") || "master_sessions_raw";
// Room password (VDO encryption key). MUST match the console's director/scene
// URLs or the guest's video silently never reaches the console. Carried in the
// invite link + guest redirect. Empty = VDO default (matches an unset console).
const PASS = params.get("password") || params.get("pass") || params.get("pw") || "";
// Crew path: a host confirms camera/mic here, then we hand them to the console
// where their camera activates their FIXED seat box (seat_<key>_cam).
const CREW = params.get("crew") === "1";
const SEAT = (params.get("seat") || "").toLowerCase().replace(/[^a-z0-9]/g, "");
function id(x){ return document.getElementById(x); }
function esc(s){const e=document.createElement('span');e.textContent=String(s||'');return e.innerHTML;}
const session=window.rawSession(ROOM);
const els = {
  who:id("who"), cam:id("cam"), preview:id("preview"), camPh:id("camPh"),
  preflight:id("preflight"), micBar:id("micBar"), micHint:id("micHint"),
  camSel:id("camSel"), micSel:id("micSel"), nameInput:id("nameInput"), enterBtn:id("enterBtn"),
  stage:id("stage"), status:id("status"), pip:id("pip"), statusT:id("statusT"), statusS:id("statusS")
};

let NAME = (params.get("name")||"").trim().slice(0,60);
if (NAME) els.nameInput.value = NAME;
if(CREW){
  const names={rj:'RJ',greg:'Greg',rafa:'Rafa'};
  if(!names[SEAT]) location.replace('index.html?room='+encodeURIComponent(ROOM));
  NAME=names[SEAT]||'';els.nameInput.value=NAME;els.nameInput.readOnly=true;
  const field=document.createElement('div');field.className='field';
  field.innerHTML='<label for="hostCode">Private host code</label><input id="hostCode" type="password" autocomplete="one-time-code" placeholder="Host access code">';   // audit 3.2: one-time-code stops the browser saving "RJ / <code>" and autofilling it into the console gate
  els.enterBtn.before(field);
  els.enterBtn.textContent='Reserve '+NAME+' seat and enter studio →';
  id('pfHint').textContent='Test your camera and microphone. Your seat is checked before you enter; another device cannot occupy it at the same time.';
}

/* ---------- Preflight: local preview, device pickers, mic meter ---------- */
let previewStream=null, audioCtx=null, rafId=null;

async function initPreflight(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    els.camPh.textContent = "This browser can't preview your camera — you can still enter.";
    return;
  }
  try{
    previewStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  }catch(e){
    els.camPh.textContent = "Camera or mic blocked. Allow access in your browser, or enter anyway and fix it inside.";
    await populateDevices();
    return;
  }
  els.preview.srcObject = previewStream;
  els.preview.classList.remove("hidden");
  els.camPh.classList.add("hidden");
  await populateDevices();
  syncSelectionFromStream();
  startMeter();
}

async function populateDevices(){
  let devs=[];
  try{ devs = await navigator.mediaDevices.enumerateDevices(); }catch(e){}
  fillSelect(els.camSel, devs.filter(d=>d.kind==="videoinput"));
  fillSelect(els.micSel, devs.filter(d=>d.kind==="audioinput"));
}
function fillSelect(sel, list){
  sel.innerHTML="";
  if(!list.length){ const o=document.createElement("option"); o.value=""; o.textContent="Default"; sel.appendChild(o); return; }
  list.forEach((d,i)=>{ const o=document.createElement("option"); o.value=d.deviceId; o.textContent=d.label||("Device "+(i+1)); sel.appendChild(o); });
}
function syncSelectionFromStream(){
  try{
    const vt=previewStream.getVideoTracks()[0], at=previewStream.getAudioTracks()[0];
    if(vt){ const s=vt.getSettings(); if(s.deviceId) els.camSel.value=s.deviceId; }
    if(at){ const s=at.getSettings(); if(s.deviceId) els.micSel.value=s.deviceId; }
  }catch(e){}
}
async function switchDevices(){
  stopMeter();
  if(previewStream){ previewStream.getTracks().forEach(t=>t.stop()); }
  const cam=els.camSel.value, mic=els.micSel.value;
  try{
    previewStream = await navigator.mediaDevices.getUserMedia({
      video: cam ? { deviceId:{ exact:cam } } : true,
      audio: mic ? { deviceId:{ exact:mic } } : true
    });
    els.preview.srcObject=previewStream;
    els.preview.classList.remove("hidden");
    els.camPh.classList.add("hidden");
    startMeter();
  }catch(e){
    els.camPh.textContent="Couldn't switch device.";
    els.camPh.classList.remove("hidden");
  }
}
function startMeter(){
  try{
    const at=previewStream && previewStream.getAudioTracks()[0];
    if(!at) return;
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(previewStream);
    const an=audioCtx.createAnalyser(); an.fftSize=512; src.connect(an);
    const data=new Uint8Array(an.frequencyBinCount);
    let seen=false;
    (function loop(){
      an.getByteTimeDomainData(data);
      let peak=0; for(let i=0;i<data.length;i++){ const v=Math.abs(data[i]-128); if(v>peak) peak=v; }
      const pct=Math.min(100, Math.round((peak/128)*180));
      els.micBar.style.width=pct+"%";
      if(pct>7 && !seen){ seen=true; els.micHint.textContent="sounds good"; }
      rafId=requestAnimationFrame(loop);
    })();
  }catch(e){}
}
function stopMeter(){
  if(rafId) cancelAnimationFrame(rafId); rafId=null;
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx=null; }
  if(els.micBar) els.micBar.style.width="0";
}
els.camSel.addEventListener("change", switchDevices);
els.micSel.addEventListener("change", switchDevices);

/* Only admitted guests publish; host claims carry across the greenroom handoff. */
let client=null, publisher=null, confirmed=false;
function stopPublisher(){if(publisher){publisher.remove();publisher=null;}}
function startCamera(member){
  if(publisher)return;
  if(previewStream){previewStream.getTracks().forEach(t=>t.stop());previewStream=null;}stopMeter();
  const q=new URLSearchParams({room:ROOM,webcam:'',push:member.streamID,label:NAME,cleanoutput:'',autostart:''});
  if(PASS)q.set('password',PASS);
  const cam=els.camSel.selectedOptions[0]?.textContent,mic=els.micSel.selectedOptions[0]?.textContent;
  if(cam&&cam!=='Default')q.set('videodevice',cam);if(mic&&mic!=='Default')q.set('audiodevice',mic);
  publisher=document.createElement('iframe');publisher.allow='camera; microphone; autoplay; fullscreen';publisher.title='Your camera and conversation';publisher.src=VDO_BASE+'/?'+q;
  els.cam.appendChild(publisher);els.preview.classList.add('hidden');els.camPh.classList.add('hidden');
}
function enter(){
  if(confirmed)return;
  NAME=els.nameInput.value.trim().slice(0,60);if(!NAME){els.nameInput.focus();return;}
  const code=CREW?id('hostCode').value:'';
  if(CREW&&!code){id('hostCode').focus();return;}
  confirmed=true;els.enterBtn.disabled=true;id('pfHint').textContent=CREW?'Checking your seat…':'Connecting to the host…';
  client=new RawRoomClient(ROOM,{...session,name:NAME,seat:CREW?SEAT:'',code,ready:false});
  client.addEventListener('joined',e=>{
    if(CREW){
      sessionStorage.setItem('raw.host.identity',JSON.stringify({name:NAME,code}));
      sessionStorage.setItem('raw.host.seat',SEAT);
      sessionStorage.setItem('raw.host.cam',els.camSel.selectedOptions[0]?.textContent||'');
      sessionStorage.setItem('raw.host.mic',els.micSel.selectedOptions[0]?.textContent||'');
      sessionStorage.setItem('raw.host.enter','1');sessionStorage.setItem('raw.host.autopub','1');
      stopMeter();previewStream?.getTracks().forEach(t=>t.stop());
      // Keep the reservation until the authenticated console replaces this socket.
      const q=new URLSearchParams({room:ROOM});if(PASS)q.set('password',PASS);
      location.replace('index.html?'+q);return;
    }
    els.preflight.classList.add('hidden');els.stage.classList.remove('hidden');
  });
  client.addEventListener('state',e=>{
    if(CREW)return;
    const me=e.detail.members.find(m=>m.id===session.id);
    if(me?.admitted){startCamera(me);els.statusT.textContent="You're in the studio";els.statusS.textContent='You can talk with the hosts. The controller selects when you appear in the program.';els.pip.className='pip live';}
    else {stopPublisher();els.statusT.textContent='Waiting for admission';els.statusS.textContent='Your camera and microphone are not being sent to the studio.';els.pip.className='pip wait';}
  });
  client.addEventListener('offline',()=>{els.statusT.textContent='Reconnecting…';els.statusS.textContent='Camera stays live; reconnecting to the room…';});   // audit 1.2: keep the guest camera publishing across a control-channel blip; it is torn down only on fatal or when leaving
  client.addEventListener('fatal',e=>{stopPublisher();confirmed=false;els.enterBtn.disabled=false;els.preflight.classList.remove('hidden');id('pfHint').textContent=e.detail;});
  client.connect();
}
els.enterBtn.addEventListener('click',enter);
els.nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')enter();});
window.addEventListener('pagehide',()=>{stopPublisher();client?.close(false);});

// F8: stop the preview camera + mic meter if the guest leaves before entering
// (enter() already tears these down on the normal path).
window.addEventListener("pagehide", function(){
  try{ stopMeter(); }catch(e){}
  if(previewStream){ try{ previewStream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} previewStream=null; }
});

initPreflight();
</script>
</body>
</html>
